<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Piyu 💕</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stars"></canvas>
  <canvas id="confetti"></canvas>

  <div class="petals-container" id="petalsContainer"></div>

  <main class="container">
    <div class="glow-card">
      <div class="card-content">
        <div class="name-display">
          <span class="star-letter" data-letter="P">P</span>
          <span class="star-letter" data-letter="I">I</span>
          <span class="star-letter" data-letter="Y">Y</span>
          <span class="star-letter" data-letter="U">U</span>
        </div>

        <div class="heart-wrapper">
          <div class="heart" id="heart">
            <span class="heart-inner"></span>
          </div>
        </div>

        <div class="message-box">
          <h1 class="title">I'm Sorry, Piyu 💕</h1>
          <p class="apology-text">
            I messed up, and I hate that I hurt you.<br>
            You mean everything to me, and I promise to do better.<br>
            Please forgive me? 🙏
          </p>
          <p class="from-text">— Prenshu</p>
        </div>

        <button id="forgiveBtn" class="forgive-btn">
          <span>I Forgive You</span>
        </button>

        <div id="thankYou" class="thank-you">
          <h2>Thank You, My Love! ❤️</h2>
          <p>I promise to make it up to you!</p>
          <p class="love-note">I Love You 💕</p>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
