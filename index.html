<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Piyu 💕</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stars"></div>
  <div class="petals"></div>

  <main class="card">
    <div class="name">P I Y U</div>

    <div class="heart" id="heart"></div>

    <div class="message">
      <h1>I'm Sorry 💕</h1>
      <p>I messed up. I hate that I hurt you.</p>
      <p>You mean everything to me.</p>
      <p>Please forgive me?</p>
      <p class="from">— Prenshu</p>
    </div>

    <button id="forgive" class="btn">I Forgive You ❤️</button>

    <div class="success" id="success">
      <h2>Thank You! 🥹</h2>
      <p>I love you too! 💕</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
