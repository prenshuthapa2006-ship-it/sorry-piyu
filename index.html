<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Piyu ❤️</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="petals-container" id="petalsContainer"></div>

  <main class="container">
    <div class="name-spelling" id="nameSpelling">
      <span class="petal-letter" data-letter="P">P</span>
      <span class="petal-letter" data-letter="I">I</span>
      <span class="petal-letter" data-letter="Y">Y</span>
      <span class="petal-letter" data-letter="U">U</span>
    </div>

    <div class="heart-container">
      <div class="heart" id="heart">
        <span class="heart-inner"></span>
      </div>
    </div>

    <div class="message-container" id="messageContainer">
      <h1 class="title">I'm Sorry, Piyu 💕</h1>
      <p class="apology-text">
        I messed up, and I hate that I hurt you.<br>
        You mean everything to me, and I promise to do better.<br>
        Please forgive me? 🙏
      </p>
      <p class="from-text">— Prenshu</p>
    </div>

    <button id="forgiveBtn" class="forgive-btn">
      <span>I Forgive You</span>
    </button>

    <div id="thankYou" class="thank-you">
      <h2>Thank You, My Love! ❤️</h2>
      <p>I promise to make it up to you!</p>
      <p class="love-note">I Love You 💕</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
